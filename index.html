          <nav className="md:hidden fixed bottom-6 left-4 right-4 z-[100] bg-black/80 backdrop-blur-xl border border-neon-cyan/30 rounded-2xl h-16 flex justify-around items-center shadow-[0_5px_20px_rgba(0,0,0,0.5)]">
            {items.map(item => (
              <button key={item.id} onClick={() => setTab(item.id)} className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition-all duration-300 ${active === item.id ? 'text-neon-cyan -translate-y-1' : 'text-gray-400'}`}>
                <span className={`text-2xl ${active === item.id ? 'drop-shadow-[0_0_10px_#00FBFF]' : ''}`}>{item.icon}</span>
                <span className="text-[9px] font-bold tracking-widest">{active === item.id ? item.label : ''}</span>
              </button>
            ))}
          </nav>
        </>
      );
    };

    const Hero = ({ goTo }) => (
      <div className="flex flex-col items-center justify-center min-h-[85vh] text-center px-4 relative z-10 animate-fade-in pt-20">
        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[350px] h-[350px] bg-neon-cyan/10 rounded-full blur-[100px] -z-10"></div>
        <h1 className="text-5xl md:text-8xl font-black italic tracking-tighter mb-4 text-white drop-shadow-[0_0_20px_rgba(0,251,255,1)]">
          ACELERA <br /><span className="text-transparent bg-clip-text bg-gradient-to-r from-neon-cyan to-neon-magenta">TU RUTA</span>
        </h1>

        <h2 className="text-lg md:text-2xl text-white font-black tracking-widest uppercase mb-2 border-b-2 border-neon-cyan/50 pb-4 inline-block shadow-[0_10px_20px_-10px_#00FBFF] max-w-4xl leading-relaxed">
          TU LICENCIA A UN CLIC: GESTIÓN INTEGRAL Y ASESORÍA PERSONALIZADA
        </h2>
        <p className="text-sm md:text-base text-neon-cyan font-bold tracking-wider mb-12 uppercase drop-shadow-[0_0_8px_rgba(0,251,255,0.8)]">
          Punto de venta oficial - Los mejores convenios con Academias de Automovilismo
        </p>

        <div className="flex flex-col md:flex-row gap-8 w-full max-w-lg">
          <button onClick={() => goTo('CURSOS')} className="flex-1 py-5 bg-black/50 border-2 border-neon-cyan text-neon-cyan font-bold uppercase tracking-widest rounded-lg hover:bg-neon-cyan hover:text-black transition-all shadow-[0_0_20px_#00FBFF]">Ver Licencias</button>
          <button onClick={() => goTo('TIENDA')} className="flex-1 py-5 bg-black/50 border-2 border-neon-magenta text-neon-magenta font-bold uppercase tracking-widest rounded-lg hover:bg-neon-magenta hover:text-white transition-all shadow-[0_0_20px_#FF00FF]">Ir a Tienda</button>
        </div>
      </div>
    );

    const PlayVial = () => {
      // Mock data for tags since we don't have real API
      const formatVideo = (index, type) => {
        const isNew = index < 2;
        const isPremiere = index === 0 && type === 'novedades';
        return { isNew, isPremiere };
      };

      return (
        <div className="pb-32 pt-10 md:pt-12 animate-fade-in min-h-screen container mx-auto max-w-6xl px-6 md:px-12">
          {/* HERO SECTION - DESTACADO */}
          <div className="w-full mb-16 relative z-10 flex flex-col items-center">
            <div className="w-full max-w-5xl aspect-video md:aspect-[21/9] bg-black relative group mb-8 rounded-2xl overflow-hidden border border-neon-cyan/50 shadow-[0_0_30px_rgba(0,251,255,0.15)] cyber-frame">
              <iframe
                src={`https://www.youtube.com/embed/videoseries?list=${PLAYLISTS.HERO}&autoplay=0&mute=0&rel=0`}
                className="w-full h-full"
                title="Video Destacado de Acelera Tu Ruta: Tutoriales y Novedades"
                frameBorder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowFullScreen
              ></iframe>
            </div>

            {/* SUBSCRIBE BUTTON */}
            <div className="flex justify-center w-full">
              <a href={YOUTUBE_SUB_URL} target="_blank" className="relative group">
                <div className="absolute inset-0 bg-neon-magenta blur-[20px] opacity-20 group-hover:opacity-40 transition-opacity"></div>
                <button className="relative flex items-center gap-3 bg-black/80 backdrop-blur-md border border-neon-magenta text-neon-magenta px-8 py-3 rounded-xl font-black uppercase tracking-widest shadow-[0_0_15px_rgba(255,0,255,0.3)] group-hover:shadow-[0_0_25px_rgba(255,0,255,0.6)] group-hover:scale-105 transition-all duration-300">
                  <span className="animate-pulse-fast">🔴</span> SUSCRÍBETE AL CANAL
                </button>
              </a>
            </div>
          </div>

          {/* NOVEDADES GRID */}
          <div className="mb-20">
            <div className="flex items-center gap-4 mb-8 px-2 border-l-4 border-neon-cyan pl-4">
              <h2 className="text-2xl md:text-3xl font-black text-white uppercase tracking-widest drop-shadow-[0_0_10px_#00FBFF]">NOVEDADES</h2>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
              {[0, 1, 2].map((index) => {
                const status = formatVideo(index, 'novedades');
                return (
                  <div key={index} className="aspect-video w-full bg-black/50 backdrop-blur-sm cyber-frame overflow-hidden relative group hover:-translate-y-2 transition-transform duration-300">
                    {status.isPremiere && <div className="absolute top-2 right-2 bg-neon-magenta text-white text-[10px] font-bold px-2 py-1 z-20 animate-pulse border border-white">ESTRENO</div>}
                    {!status.isPremiere && status.isNew && <div className="absolute top-2 right-2 bg-neon-cyan text-black text-[10px] font-bold px-2 py-1 z-20 border border-black">NUEVO</div>}
                    <iframe className="w-full h-full opacity-90 group-hover:opacity-100 transition-opacity" src={`https://www.youtube.com/embed?listType=playlist&list=${PLAYLISTS.NOVEDADES}&index=${index}&rel=0`} title={`Video Novedad Acelera Tu Ruta #${index + 1}`} frameBorder="0" allowFullScreen loading="lazy"></iframe>
                  </div>
                );
              })}
            </div>
          </div>

          {/* ACADEMIA GRID */}
          <div className="mb-12">
            <div className="flex items-center gap-4 mb-8 px-2 border-l-4 border-neon-magenta pl-4">
              <h2 className="text-2xl md:text-3xl font-black text-white uppercase tracking-widest drop-shadow-[0_0_10px_#FF00FF]">ACADEMIA VIRTUAL</h2>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
              {[0, 1, 2].map((index) => (
                <div key={index} className="aspect-video w-full bg-black/50 backdrop-blur-sm cyber-frame overflow-hidden relative group hover:-translate-y-2 transition-transform duration-300">
                  <iframe className="w-full h-full opacity-90 group-hover:opacity-100 transition-opacity" src={`https://www.youtube.com/embed?listType=playlist&list=${PLAYLISTS.ACADEMIA}&index=${index}&rel=0`} title={`Clase Academia Acelera Tu Ruta #${index + 1}`} frameBorder="0" allowFullScreen loading="lazy"></iframe>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const Store = () => {
      const [activeCategory, setActiveCategory] = useState({ parent: "Todos", sub: null });
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [accordionOpen, setAccordionOpen] = useState(false);

      // Filtrado de Productos
      const getFilteredProducts = () => {
        if (activeCategory.parent === "Todos") return PRODUCTS;
        // Filtrar por subcategoría si existe
        if (activeCategory.sub) return PRODUCTS.filter(p => p.category === activeCategory.sub);
        // Filtrar por categorías que pertenezcan al padre
        return PRODUCTS.filter(p => {
          const parentGroup = STORE_STRUCTURE.find(g => g.title === activeCategory.parent);
          return parentGroup && parentGroup.subcategories.includes(p.category);
        });
      };

      const filteredItems = getFilteredProducts();

      const ProductModal = ({ product, onClose }) => {
        if (!product) return null;
        const [activeImg, setActiveImg] = useState(product.img);

        return (
          <div className="fixed inset-0 z-[200] bg-black/90 backdrop-blur-xl flex items-center justify-center p-4 animate-fade-in" onClick={onClose}>
            <div className="w-full max-w-4xl bg-black border border-neon-cyan/30 rounded-2xl overflow-hidden flex flex-col md:flex-row shadow-[0_0_50px_rgba(0,251,255,0.1)] max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
              {/* Image Gallery Side */}
              <div className="w-full md:w-1/2 p-4 bg-[#0a0c10]">
                <div className="aspect-square rounded-xl overflow-hidden border border-gray-800 mb-4">
                  <img src={activeImg} className="w-full h-full object-cover" alt={product.name} />
                </div>
                <div className="grid grid-cols-3 gap-2">
                  {product.images && product.images.map((img, i) => (
                    <div key={i} onClick={() => setActiveImg(img)} className={`aspect-square rounded-lg overflow-hidden border ${activeImg === img ? 'border-neon-cyan opacity-100' : 'border-gray-800 opacity-70'} hover:opacity-100 cursor-pointer transition-all`}>
                      <img src={img} className="w-full h-full object-cover" />
                    </div>
                  ))}
                </div>
              </div>
              {/* Info Side */}
              <div className="w-full md:w-1/2 p-6 md:p-8 flex flex-col">
                <div className="flex justify-between items-start mb-4">
                  <div>
                    <span className="text-neon-cyan text-xs font-bold uppercase tracking-widest border border-neon-cyan/50 px-2 py-1 rounded">{product.category}</span>
                    <h2 className="text-2xl md:text-3xl font-black text-white uppercase leading-tight mt-2">{product.name}</h2>
                    <span className="text-sm text-gray-500">REF: {product.ref}</span>
                  </div>
                  <button onClick={onClose} className="text-gray-400 hover:text-white text-2xl">✕</button>
                </div>

                <div className="text-3xl font-bold text-neon-magenta mb-6">${product.price.toLocaleString()}</div>

                <div className="space-y-6 flex-1 overflow-y-auto pr-2 custom-scroll">
                  <div>
                    <h3 className="text-sm font-bold text-white uppercase mb-2">Descripción</h3>
                    <p className="text-gray-400 text-sm leading-relaxed whitespace-pre-line">{product.fullDesc || product.desc}</p>
                  </div>

                  {product.techSpecs && (
                    <div>
                      <h3 className="text-sm font-bold text-white uppercase mb-2">Ficha Técnica</h3>
                      <ul className="text-xs text-gray-400 space-y-1">
                        {product.techSpecs.map((spec, i) => (
                          <li key={i} className="flex items-center gap-2">
                            <span className="w-1 h-1 bg-neon-cyan rounded-full"></span>
                            {spec}
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  <div className="bg-white/5 rounded-lg p-3 text-xs text-gray-300 border-l-2 border-neon-cyan">
                    <p>🚚 Tiempo de entrega: <span className="text-white font-bold">{product.deliveryTime || "2-5 días"}</span></p>
                  </div>
                </div>

                <button
                  onClick={() => window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=Hola, quiero comprar: ${product.name} REF:${product.ref}`, '_blank')}
                  className="w-full mt-6 py-4 bg-neon-cyan text-black font-black uppercase tracking-widest rounded-lg hover:bg-white transition-all shadow-[0_0_20px_#00FBFF]"
                >
                  COMPRAR AHORA
                </button>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="container mx-auto px-6 md:px-12 py-8 md:py-12 pb-32 animate-fade-in flex flex-col md:flex-row gap-8 max-w-6xl pt-4 md:pt-12">

          {/* SIDEBAR NAVIGATION */}
          <aside className="hidden md:block w-72 flex-shrink-0">
            <div className="glass p-6 rounded-xl sticky top-28 border-l-4 border-neon-cyan shadow-[0_0_20px_rgba(0,251,255,0.1)]">
              <h3 className="text-xl font-black text-white mb-6 uppercase tracking-widest cursor-pointer hover:text-neon-cyan" onClick={() => setActiveCategory({ parent: "Todos", sub: null })}>
                CATÁLOGO
              </h3>
              <div className="space-y-6">
                {STORE_STRUCTURE.map((group, idx) => (
                  <div key={idx}>
                    <h4
                      className={`text-sm font-bold uppercase tracking-wider mb-3 cursor-pointer transition-colors ${activeCategory.parent === group.title ? 'text-neon-cyan' : 'text-gray-400 hover:text-white'}`}
                      onClick={() => setActiveCategory({ parent: group.title, sub: null })}
                    >
                      {group.title}
                    </h4>
                    <div className={`space-y-1 pl-4 border-l border-gray-800 transition-all ${activeCategory.parent === group.title ? 'opacity-100' : 'opacity-50'}`}>
                      {group.subcategories.map(sub => (
                        <button
                          key={sub}
                          onClick={() => setActiveCategory({ parent: group.title, sub })}
                          className={`block w-full text-left text-xs py-1 transition-all ${activeCategory.sub === sub ? 'text-white font-bold translate-x-1' : 'text-gray-500 hover:text-gray-300'}`}
                        >
                          {sub}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>

              {/* INFO ACCORDION */}
              <div className="mt-8 pt-6 border-t border-gray-800">
                <button onClick={() => setAccordionOpen(!accordionOpen)} className="flex items-center justify-between w-full text-xs font-bold text-gray-300 uppercase tracking-wider hover:text-white">
                  <span>Información de Compra</span>
                  <span>{accordionOpen ? '−' : '+'}</span>
                </button>
                <div className={`overflow-hidden transition-all duration-300 ${accordionOpen ? 'max-h-60 mt-4' : 'max-h-0'}`}>
                  <ul className="text-[10px] text-gray-500 space-y-2">
                    <li>• Pago contra entrega disponible.</li>
                    <li>• Aceptamos todos los medios de pago.</li>
                    <li>• Envío no incluido.</li>
                    <li>• Entrega 2-8 días hábiles.</li>
                  </ul>
                </div>
              </div>
            </div>
          </aside>

          {/* MOBILE CATEGORIES (Simplificado) */}
          <div className="md:hidden overflow-x-auto pb-4 scrollbar-hide flex gap-3">
            <button onClick={() => setActiveCategory({ parent: "Todos", sub: null })} className={`px-4 py-2 rounded-full text-[10px] font-bold border ${activeCategory.parent === "Todos" ? 'bg-neon-cyan text-black border-neon-cyan' : 'border-gray-800 text-gray-400'}`}>TODOS</button>
            {STORE_STRUCTURE.map(g => (
              <button key={g.title} onClick={() => setActiveCategory({ parent: g.title, sub: null })} className={`px-4 py-2 rounded-full text-[10px] font-bold border whitespace-nowrap ${activeCategory.parent === g.title ? 'bg-neon-cyan text-black border-neon-cyan' : 'border-gray-800 text-gray-400'}`}>{g.title}</button>
            ))}
          </div>

          <div className="flex-1">
            <div className="flex items-center justify-between mb-4 md:mb-8 border-b border-gray-800 pb-4">
              <div>
                <h2 className="text-2xl md:text-3xl font-black italic text-white uppercase drop-shadow-[0_0_10px_#00FBFF]">{activeCategory.sub || activeCategory.parent.replace(/🧥|🚗/g, '').trim()}</h2>
                <p className="text-gray-500 text-xs hidden md:block">Explora nuestra colección oficial</p>
              </div>
              <span className="text-[10px] md:text-xs font-bold text-black bg-neon-cyan px-2 md:px-3 py-1 rounded shadow-[0_0_10px_#00FBFF]">{filteredItems.length} ITEMS</span>
            </div>

            {filteredItems.length > 0 ? (
              <div className="grid grid-cols-2 lg:grid-cols-3 gap-8">
                {filteredItems.map(item => (
                  <div key={item.id} className="glass rounded-xl overflow-hidden relative group hover:-translate-y-2 transition-transform duration-300 border border-neon-cyan cursor-pointer" onClick={() => setSelectedProduct(item)}>
                    <div className="absolute top-0 right-0 bg-neon-magenta text-white text-[9px] font-bold px-2 py-1 rounded-bl-xl z-10 shadow-[0_0_10px_#FF00FF]">REF: {item.ref}</div>
                    {item.img && (
                      <div className="aspect-square bg-gray-900 relative overflow-hidden border border-neon-cyan/50 shadow-[0_0_10px_rgba(0,251,255,0.2)] rounded-lg mx-2 md:mx-4 mt-2 md:mt-4">
                        <img src={item.img} alt={`${item.name} - Accesorio Motero Acelera Tu Ruta`} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-110 transition-all duration-500" />
                        <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
                      </div>
                    )}
                    <div className="p-3 md:p-6">
                      <span className="text-[9px] md:text-[10px] font-bold text-neon-cyan border border-neon-cyan/50 px-2 py-0.5 rounded mb-2 inline-block shadow-[0_0_5px_rgba(0,251,255,0.3)]">{item.category}</span>
                      <h4 className="text-sm md:text-xl font-black text-white uppercase leading-tight mb-2 group-hover:text-neon-cyan transition-colors line-clamp-2">{item.name}</h4>
                      {item.price && <div className="text-lg md:text-2xl font-bold text-neon-magenta mb-3 drop-shadow-[0_0_5px_#FF00FF]">${item.price.toLocaleString()}</div>}
                      <p className="text-gray-400 text-[10px] md:text-xs line-clamp-2 mb-4 font-light hidden md:block">{item.desc}</p>
                      <button className="w-full py-2 bg-white/5 hover:bg-neon-cyan hover:text-black text-neon-cyan text-[10px] font-bold uppercase tracking-widest rounded transition-all border border-neon-cyan/30 hover:border-neon-cyan">VER DETALLES</button>
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="text-center py-20 text-gray-500">
                <p>No hay productos en esta categoría por el momento.</p>
              </div>
            )}
          </div>

          {/* MODAL */}
          {selectedProduct && <ProductModal product={selectedProduct} onClose={() => setSelectedProduct(null)} />}
        </div>
      );
    };

    const Courses = () => {
      const coursesData = COURSES_DATA;

      const openWhatsapp = (ref) => {
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=Hola, quiero RESERVAR CUPO para la referencia: ${ref}`, '_blank');
      }

      return (
        <div className="container mx-auto px-6 md:px-12 py-8 md:py-12 pb-24 animate-fade-in max-w-6xl">
          <div className="flex items-center gap-4 mb-8">
            <div className="w-1 h-8 bg-neon-cyan shadow-[0_0_15px_#00FBFF]"></div>
            <h2 className="text-3xl font-black text-white uppercase tracking-widest drop-shadow-[0_0_10px_#00FBFF]">
              LICENCIAS Y CURSOS
            </h2>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {coursesData.map((course) => (
              <div
                key={course.id}
                className={`
                                    relative flex flex-col justify-between
                                    bg-black/60 backdrop-blur-md rounded-xl p-4
                                    border transition-all duration-300 hover:-translate-y-2
                                    ${course.type === 'NEW'
                    ? 'border-neon-cyan shadow-[0_0_15px_rgba(0,251,255,0.1)] hover:shadow-[0_0_25px_rgba(0,251,255,0.4)]'
                    : 'border-neon-magenta shadow-[0_0_15px_rgba(255,0,255,0.1)] hover:shadow-[0_0_25px_rgba(255,0,255,0.4)]'
                  }
                                `}
              >
                <div className={`
                                    absolute top-0 right-0 px-3 py-1 rounded-bl-xl text-[10px] font-bold text-black
                                    ${course.type === 'NEW' ? 'bg-neon-cyan' : 'bg-neon-magenta'}
                                `}>
                  REF: {course.ref}
                </div>

                <h3 className="text-lg md:text-xl font-black italic uppercase leading-tight mt-4 mb-4 text-white">
                  {course.title}
                </h3>

                {course.hours ? (
                  <div className="grid grid-cols-3 gap-2 mb-4">
                    {course.hours.theory && (
                      <div className="text-center bg-black/40 rounded p-1 border border-gray-700">
                        <div className="text-neon-cyan font-bold text-lg">{course.hours.theory}h</div>
                        <div className="text-[8px] text-gray-500 uppercase">Teoría</div>
                      </div>
                    )}
                    {course.hours.workshop && (
                      <div className="text-center bg-black/40 rounded p-1 border border-gray-700">
                        <div className="text-yellow-400 font-bold text-lg">{course.hours.workshop}h</div>
                        <div className="text-[8px] text-gray-500 uppercase">Taller</div>
                      </div>
                    )}
                    {course.hours.driving && (
                      <div className="text-center bg-black/40 rounded p-1 border border-gray-700">
                        <div className="text-neon-magenta font-bold text-lg">{course.hours.driving}h</div>
                        <div className="text-[8px] text-gray-500 uppercase">Manejo</div>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="mb-4 p-2 bg-black/40 rounded border border-gray-700 text-center">
                    <span className="text-xs text-gray-400">Trámite administrativo y validación</span>
                  </div>
                )}

                <ul className="text-xs text-white mb-6 space-y-2">
                  {MANDATORY_FEATURES.map((f, i) => (
                    <li key={i} className="flex items-start gap-2">
                      <span className="text-neon-cyan drop-shadow-[0_0_5px_#00FBFF] text-sm font-bold">✓</span>
                      <span className="font-light">{f}</span>
                    </li>
                  ))}
                </ul>

                <button
                  onClick={() => openWhatsapp(course.ref)}
                  className={`
                                        w-full py-3 rounded text-sm font-black uppercase tracking-widest transition-all
                                        border bg-transparent hover:text-black flex items-center justify-center gap-2
                                        ${course.type === 'NEW'
                      ? 'border-neon-cyan text-neon-cyan hover:bg-neon-cyan shadow-[0_0_10px_rgba(0,251,255,0.2)]'
                      : 'border-neon-magenta text-neon-magenta hover:bg-neon-magenta shadow-[0_0_10px_rgba(255,0,255,0.2)]'
                    }
                                    `}
                >
                  RESERVAR CUPO
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const App = () => {
      const [tab, setTab] = useState('INICIO');
      return (
        <div className="min-h-screen text-white overflow-x-hidden relative">
          <NeonCornerFrame />
          <Navigation active={tab} setTab={setTab} />
          <main className="relative z-10 pt-[80px]">
            {tab === 'INICIO' && <Hero goTo={setTab} />}
            {tab === 'TIENDA' && <Store />}
            {tab === 'PLAY_VIAL' && <PlayVial />}
            {tab === 'CURSOS' && <Courses />}
          </main>
          <WhatsAppButton />
          <footer className="text-center py-12 text-xs text-gray-600 pb-28 md:pb-12 border-t border-gray-900 mt-12 bg-black">
            <p>© 2024 ACELERA TU RUTA - SOACHA</p>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
